[workspace]
resolver = "2"
members = [
    "crates/gpsx-input",
    "crates/gpsx-model",
    "crates/gpsx-protocol",
    "crates/gpsx-telemetry",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "AGPL-3.0-only"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

