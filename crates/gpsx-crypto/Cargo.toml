[package]
name = "gpsx-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
aes = { version = "=0.8.4", default-features = false, features = ["zeroize"] }
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "zeroize"] }
cfb-mode = { version = "=0.8.2", default-features = false, features = ["zeroize"] }
ctr = { version = "=0.9.2", default-features = false, features = ["zeroize"] }
hmac = { version = "=0.12.1", default-features = false }
rand_core = { version = "=0.6.4", default-features = false }
secp256k1 = { version = "=0.33.1", default-features = false, features = ["alloc"] }
sha2 = { version = "=0.10.9", default-features = false }
subtle = { version = "=2.6.1", default-features = false }
zeroize = { version = "=1.9.1", default-features = false }

[lints]
workspace = true
