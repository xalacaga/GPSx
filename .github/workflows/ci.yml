name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  wrapper-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

  core-and-android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable 2026-10-25
        with:
          components: clippy,rustfmt
          targets: aarch64-linux-android
      - name: Validate declared Rust 1.85 MSRV
        shell: pwsh
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 check --workspace --all-targets
      - name: Validate portable core and evidence tooling
        shell: pwsh
        run: ./tools/powershell/check.ps1 -RequireAndroid
      - name: Test, lint and assemble Android TV
        shell: pwsh
        run: ./apps/android-tv/gradlew.bat -p ./apps/android-tv testDebugUnitTest lintDebug assembleDebug
